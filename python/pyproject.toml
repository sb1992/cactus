[project]
name = "cactus"
version = "0.1.0"
description = "Cactus Python tools"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "transformers",
    "numpy",
    "huggingface-hub",
]

[project.optional-dependencies]
vlm = ["Pillow", "num2words", "torchvision"]
lora = ["peft"]
# Dev deps for the TTS reference work (Plan 2) and the Plan 1 fixture
# generators in tests/fixtures/. Requires Python 3.11+ in practice
# because kokoro-onnx pulls in onnxruntime, which has no 3.9 wheels.
dev = [
    "kokoro-onnx",
    "soundfile",
    "scipy",
]

[project.scripts]
cactus = "src.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
